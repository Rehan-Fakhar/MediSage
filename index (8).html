<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MediSage – Smart Health Companion</title>
<style>
:root{--bg:#f3f6f9;--ac:#1a9aa6;--navy:#12263f;--red:#b00020}*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,system-ui,sans-serif;background:var(--bg);color:var(--navy)}
.wrap{display:flex;min-height:100vh}nav{background:var(--navy);width:210px;padding:12px 0;flex-shrink:0}nav h2{color:#fff;margin:8px 16px 14px}
nav a{display:block;color:#fff;padding:9px 18px;cursor:pointer;font-size:14px}nav a:hover,nav a.on{background:var(--ac)}
main{flex:1;padding:20px;max-width:1000px}h1{margin-top:0}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.c{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 4px #0001;margin-bottom:12px}.c h3{margin:0 0 8px;color:var(--ac);font-size:15px}
big{font-size:28px;font-weight:700}label{display:block;font-size:13px;margin:6px 0}input,select,textarea{width:100%;padding:7px;border:1px solid #c5d0da;border-radius:6px;font:inherit}
button{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer;margin:6px 6px 0 0;font:inherit}button.s{background:#6b7c8f}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px;border-bottom:1px solid #e2e8ee;text-align:left}
.dis{font-size:12px;font-style:italic;color:#8a5a00}.red{background:#fdecee;border:2px solid var(--red);color:var(--red);padding:12px;border-radius:10px;font-weight:700;margin:10px 0}
.chk{display:inline-block;width:48%;font-size:13px}.chk input{width:auto}.bar{height:12px;background:#dde5ec;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.login{max-width:380px;margin:6vh auto}@media(max-width:700px){.wrap{flex-direction:column}nav{width:100%;display:flex;flex-wrap:wrap}nav h2{width:100%}}
@media print{nav,button{display:none}}
</style><style>
:root{--card:#fff;--tr:#dde5ec;--nv:#12263f}body.dk{--bg:#0e1621;--card:#16212f;--navy:#e6edf5;--tr:#2a3a4d;--nv:#0a1220}
.c,.tile{background:var(--card)}nav{background:var(--nv)}input,select,textarea{background:var(--card);color:inherit}.bar{background:var(--tr)}
.hero{background:linear-gradient(120deg,#1a9aa6,#2b6cb0);color:#fff;border-radius:16px;padding:20px;margin-bottom:14px}
.c{transition:.15s}.c:hover{box-shadow:0 4px 14px #0002}.ring{text-align:center;width:104px;font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}.tile{padding:16px 8px;border-radius:12px;text-align:center;cursor:pointer;box-shadow:0 1px 4px #0001;font-size:14px}.tile:hover{background:var(--ac);color:#fff}
.chip{padding:2px 8px;border-radius:10px;font-size:12px;background:#fde9c8;color:#8a5a00}.chip.ok{background:#d6f3e4;color:#14633a}
#rm{position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:9}#rm div{background:var(--card);padding:24px;border-radius:14px;min-width:290px;border-top:6px solid var(--ac)}
</style><style>@media(max-width:700px){.sp{grid-column:auto!important}}svg{max-width:100%}</style></head><body><div id="app"></div><script>
const DIS="This application provides educational health information and basic risk assessment only. It is not a substitute for professional medical diagnosis or treatment.";
const SYM=["Fever","Headache","Cough","Sore throat","Fatigue","Nausea","Vomiting","Diarrhea","Abdominal pain","Chest pain","Shortness of breath","Dizziness","Joint pain","Back pain","Skin rash","Loss of appetite","Weakness"];
const RED=["Loss of consciousness","Severe bleeding","Sudden one-sided weakness / speech trouble","Severe allergic reaction"];
const PAT={"Respiratory-related pattern":["Cough","Sore throat","Shortness of breath","Fatigue","Fever"],"Gastrointestinal-related pattern":["Nausea","Vomiting","Diarrhea","Abdominal pain","Loss of appetite"],"Migraine/headache-related pattern":["Headache","Nausea","Dizziness","Fatigue"],"Viral/infectious-like pattern":["Fever","Fatigue","Weakness","Headache","Sore throat","Joint pain","Cough"],"Musculoskeletal-related pattern":["Joint pain","Back pain","Weakness"],"Fatigue/dehydration-like pattern":["Fatigue","Dizziness","Weakness","Headache","Loss of appetite"],"Skin/allergy-related pattern":["Skin rash","Fever"]};
const RULES=[{n:"Chest pain with breathing difficulty",req:["Chest pain","Shortness of breath"],sev:1,t:0},{n:"Severe chest pain",req:["Chest pain"],sev:4,t:0},{n:"Severe difficulty breathing",req:["Shortness of breath"],sev:4,t:0},{n:"Loss of consciousness",req:[RED[0]],sev:1,t:0},{n:"Severe bleeding",req:[RED[1]],sev:1,t:0},{n:"Stroke-like symptoms",req:[RED[2]],sev:1,t:0},{n:"Severe allergic reaction",req:[RED[3]],sev:1,t:0},{n:"Extremely high fever with serious symptoms",req:[],sev:4,t:40}];
const RANGES={sys:[90,129],dia:[60,84],hr:[60,100],temp:[36.1,37.8],spo2:[95,100],glucose:[70,140]};
const VALID={hr:["Heart rate",25,250],temp:["Temperature °C",30,45],spo2:["Blood oxygen %",50,100],weight:["Weight kg",2,400],glucose:["Blood glucose mg/dL",20,600]};
const KINDS={bp:"Blood pressure",hr:"Heart rate",temp:"Temperature",spo2:"Blood oxygen",weight:"Weight",glucose:"Blood glucose"};
const INT=[["warfarin","aspirin","High","May increase bleeding risk."],["warfarin","ibuprofen","High","May increase bleeding risk."],["ibuprofen","aspirin","Moderate","May reduce aspirin's effect and irritate the stomach."],["lisinopril","ibuprofen","Moderate","May reduce blood-pressure control and affect kidneys."],["sildenafil","nitroglycerin","High","Can cause a dangerous drop in blood pressure."],["metformin","alcohol","Moderate","May raise the risk of lactic acidosis."]];
const KB=[["Headache","head pain, light sensitivity, nausea","Most are tension-type or migraine.","stress, poor sleep, dehydration","sudden severe onset, stiff neck, confusion","If sudden, severe, frequent, or with neurological symptoms."],["Fever","raised temperature, chills, sweating","A common response to infection.","infections, low immunity","above 39.5°C, stiff neck, rash, breathing trouble","If over 3 days, very high, or in infants/older adults."],["Cough","dry or wet cough, sore throat","Often viral, allergic or irritant-related.","smoking, allergies, asthma","blood in sputum, breathlessness, chest pain","If over 3 weeks or breathing is affected."],["Dehydration","thirst, dizziness, dark urine, fatigue","Fluid loss exceeds intake.","heat, vomiting, diarrhea","confusion, fainting, very little urine","If severe or you cannot keep fluids down."],["Gastroenteritis","nausea, vomiting, diarrhea, abdominal pain","Gut inflammation, usually infection or food.","contaminated food/water","blood in stool, severe pain, dehydration","If over 2 days or severe."]];
const GUIDE={"Chest pain":"Pressure, tightness or pain spreading to arm/jaw with sweating or breathlessness can be serious. Stop activity, sit down and call emergency services.","Breathing difficulty":"Struggling to breathe, blue lips, or being unable to speak full sentences needs urgent care. Call emergency services.","Stroke warning signs":"Face drooping, arm weakness, speech difficulty (FAST). Note the time symptoms began and call emergency services immediately.","Severe allergic reaction":"Swelling of face/throat, trouble breathing, widespread hives. Use prescribed emergency medicine if you have it and call emergency services.","Severe bleeding":"Apply firm direct pressure with a clean cloth and call emergency services.","Loss of consciousness":"Call emergency services. Do not give food or drink. Stay with the person.","Poisoning":"Call poison control or emergency services immediately. Keep the container for reference."};
const NAV=[["dash","🏠 Dashboard"],["sym","🩺 Symptom Assessment"],["vit","❤️ Vitals & BMI"],["med","💊 Medicines"],["tr","📊 Health Trends"],["his","📋 Health History"],["kb","📚 Knowledge Base"],["em","🚨 Emergency Guide"],["rep","📄 Doctor Report"],["pro","👤 Profile & Privacy"]];
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let DB=JSON.parse(localStorage.getItem("ms_db")||'{"users":{}}'),me=null,cur="login";const V={};
const save=()=>localStorage.setItem("ms_db",JSON.stringify(DB)),U=()=>DB.users[me],D=()=>U().d,val=id=>$("#"+id).value.trim();
const inp=(id,l,t="text",v="")=>`<label>${l}<input id="${id}" type="${t}" value="${esc(v)}"></label>`;
const A=f=>async(...a)=>{try{await f(...a)}catch(e){alert(e.message)}};
function num(v,l,lo,hi){const n=parseFloat(v);if(isNaN(n))throw Error(l+" must be a number.");if(n<lo||n>hi)throw Error(`${l} must be between ${lo} and ${hi}.`);return n}
const rnd=()=>btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(16))));
async function hash(p,salt){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveBits"]);const b=await crypto.subtle.deriveBits({name:"PBKDF2",salt:Uint8Array.from(atob(salt),c=>c.charCodeAt(0)),iterations:200000,hash:"SHA-256"},k,256);return btoa(String.fromCharCode(...new Uint8Array(b)))}
function shell(t,b){$("#app").innerHTML=`<div class="wrap"><nav><h2>🩺 MediSage</h2>${NAV.map(([k,l])=>`<a class="${k==cur?"on":""}" onclick="go('${k}')">${l}</a>`).join("")}<a onclick="me=null;go('login')">🚪 Logout</a></nav><main><h1>${t}</h1>${b}<p class="dis">${DIS}</p></main></div>`}
function go(v){cur=v;V[v]()}
const bmiCat=b=>b<18.5?"Underweight":b<25?"Healthy range":b<30?"Overweight":"Obese range";
const fmt=v=>v.k=="bp"?`${v.v1}/${v.v2}`:v.v1;
function stat(v){const f=(k,x)=>x<RANGES[k][0]?"Below range":x>RANGES[k][1]?"Above range":"Within range";if(v.k=="bp"){const a=f("sys",v.v1),b=f("dia",v.v2);return a.startsWith("A")||b.startsWith("A")?"Above range":a.startsWith("B")||b.startsWith("B")?"Below range":"Within range"}return RANGES[v.k]?f(v.k,v.v1):v.k=="bmi"?bmiCat(v.v1):""}
const last=k=>D().vitals.filter(v=>v.k==k).slice(-1)[0],active=()=>D().meds.filter(m=>!m.end||m.end>=new Date().toISOString().slice(0,10));
const rows=(h,r)=>`<table><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${r.map(x=>`<tr>${x.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")||`<tr><td colspan=${h.length}>No records yet.</td></tr>`}</table>`;
// ---- login/register ----
V.login=()=>{$("#app").innerHTML=`<div class="c login"><h2>🩺 MediSage</h2><p>Your health records stay in this browser. Nothing is uploaded.</p>${inp("u","Username")}${inp("p","Password","password")}<button onclick="doLogin()">Login</button><button class="s" onclick="V.reg()">Create account</button><p class="dis">${DIS}</p></div>`};
window.doLogin=A(async()=>{const u=DB.users[val("u").toLowerCase()];if(!u||await hash($("#p").value,u.salt)!==u.h)throw Error("Invalid username or password.");me=val("u").toLowerCase();go("dash")});
V.reg=()=>{$("#app").innerHTML=`<div class="c login"><h2>Create account</h2>${[["u","Username"],["p","Password (min 8)","password"],["n","Full name"],["a","Age","number"],["g","Gender"],["h","Height (cm)","number"],["w","Weight (kg)","number"],["bg","Blood group"],["ec","Emergency contact"],["al","Known allergies"],["co","Existing conditions"]].map(f=>inp(...f)).join("")}<button onclick="doReg()">Save</button><button class="s" onclick="V.login()">Back</button></div>`};
window.doReg=A(async()=>{const u=val("u").toLowerCase();if(u.length<3)throw Error("Username needs at least 3 characters.");if(DB.users[u])throw Error("Username already exists.");if($("#p").value.length<8)throw Error("Password must be at least 8 characters.");if(!val("n"))throw Error("Name is required.");const salt=rnd();DB.users[u]={salt,h:await hash($("#p").value,salt),p:{name:val("n"),age:num(val("a"),"Age",0,120),gender:val("g"),height:num(val("h"),"Height",50,250),weight:num(val("w"),"Weight",2,400),bg:val("bg"),ec:val("ec"),al:val("al"),co:val("co")},d:{sym:[],vitals:[],meds:[]}};save();alert("Account created. Please log in.");V.login()});
// ---- dashboard ----
V.dash=()=>{const u=U(),b=last("bmi");shell("Dashboard",`<p>Welcome, <b>${esc(u.p.name)}</b> • ${new Date().toDateString()}</p><div class="g"><div class="c"><h3>BMI</h3><big>${b?b.v1:"—"}</big> ${b?bmiCat(b.v1):"Record in Vitals"}</div><div class="c"><h3>Current medicines</h3>${rows(["Medicine","Dosage"],active().map(m=>[m.name,m.dose]))}</div><div class="c"><h3>Recent symptoms</h3>${rows(["Date","Symptoms","Risk"],D().sym.slice(-4).reverse().map(s=>[s.ts.slice(0,10),s.s.join(", "),s.risk]))}</div><div class="c"><h3>Recent vitals</h3>${rows(["Vital","Value","Status"],D().vitals.filter(v=>v.k!="bmi").slice(-4).reverse().map(v=>[KINDS[v.k],fmt(v),stat(v)]))}</div></div>${NAV.slice(1,8).map(([k,l])=>`<button onclick="go('${k}')">${l}</button>`).join("")}`)};
// ---- symptoms ----
function assess(sel,sev,dur,t){const flags=RULES.filter(r=>r.req.every(x=>sel.includes(x))&&sev>=r.sev&&t>=r.t&&(r.req.length||r.t>0)).map(r=>r.n);const m=Object.entries(PAT).map(([c,p])=>{const h=p.filter(s=>sel.includes(s));return[h.length/p.length*100,c,h,p.filter(s=>!sel.includes(s))]}).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]).slice(0,3);return{flags,m,risk:flags.length?"Emergency":sev>=4||t>=39.5?"High":sev==3||dur>7?"Moderate":"Low"}}
V.sym=()=>{shell("Symptom Assessment",`<div class="c">${[...SYM,...RED].map((s,i)=>`<label class="chk"><input type="checkbox" value="${esc(s)}" class="sy"> ${esc(s)}</label>`).join("")}<div class="g">${inp("age","Age","number",U().p.age)}${inp("dur","Duration (days)","number",1)}${inp("sev","Severity (1–5)","number",2)}${inp("temp","Temperature °C (optional)","number")}</div><button onclick="doAssess()">Assess</button></div><div id="out"></div>`)};
window.doAssess=A(()=>{const sel=[...document.querySelectorAll(".sy:checked")].map(x=>x.value);if(!sel.length)throw Error("Select at least one symptom.");num(val("age"),"Age",0,120);const dur=num(val("dur"),"Duration",0,3650),sev=num(val("sev"),"Severity",1,5),t=val("temp")?num(val("temp"),"Temperature",30,45):0,r=assess(sel,sev,dur,t),ic={Low:"🟢",Moderate:"🟡",High:"🟠",Emergency:"🔴"}[r.risk];const nx={Emergency:"Contact local emergency services or go to the nearest emergency department.",High:"Arrange to see a healthcare professional promptly.",Moderate:"Monitor symptoms and consider consulting a healthcare professional.",Low:"Rest, stay hydrated and monitor; seek care if symptoms worsen."}[r.risk];
$("#out").innerHTML=(r.flags.length?`<div class="red">POTENTIAL MEDICAL EMERGENCY DETECTED. Please seek immediate professional medical attention.<br>Warning signs: ${esc(r.flags.join("; "))}</div>`:"")+`<div class="c"><h3>Risk level: ${ic} ${r.risk}</h3>${r.m.map(([p,c,h,m])=>`<p><b>${c}</b> – ${p.toFixed(0)}% pattern match<div class="bar"><i style="width:${p}%"></i></div>Supporting: ${esc(h.join(", "))}<br>Not reported: ${esc(m.join(", ")||"none")}</p>`).join("")}<p><b>Next step:</b> ${nx}</p><p class="dis">These are pattern matches from a small local dataset, not a medical diagnosis.</p></div>`;
D().sym.push({ts:new Date().toISOString(),s:sel,sev,dur,t,risk:r.risk,top:r.m[0]?.[1]||"No pattern"});save()});
// ---- vitals ----
V.vit=()=>{const u=U(),vs=D().vitals.filter(v=>v.k!="bmi").slice(-12).reverse();shell("Vitals & BMI",`<div class="c"><h3>Record a vital</h3><label>Type<select id="k">${Object.entries(KINDS).map(([k,l])=>`<option value="${k}">${l}</option>`).join("")}</select></label>${inp("v","Value (blood pressure as 120/80)")}${inp("nt","Note (optional)")}<button onclick="addVit()">Save</button></div><div class="c">${rows(["Time","Vital","Current","Previous","Reference","Note"],vs.map(v=>{const p=D().vitals.filter(x=>x.k==v.k&&x.ts<v.ts).slice(-1)[0];return[v.ts.slice(0,16).replace("T"," "),KINDS[v.k],fmt(v),p?fmt(p)+(p.v1<v.v1?" ↑":p.v1>v.v1?" ↓":" →"):"—",stat(v),v.note]}))}</div><div class="c"><h3>BMI calculator</h3>${inp("bh","Height (cm)","number",u.p.height)}${inp("bw","Weight (kg)","number",u.p.weight)}<button onclick="calcBmi()">Calculate & save</button><p id="bres"></p><div class="bar"><i id="bbar" style="width:0"></i></div><p class="dis">BMI is a screening measure, not a complete assessment of health.</p></div>`)};
window.addVit=A(()=>{const k=$("#k").value,t=val("v");let v1,v2=null;if(k=="bp"){const m=t.split("/");if(m.length!=2)throw Error("Blood pressure must look like 120/80.");v1=num(m[0],"Systolic",60,260);v2=num(m[1],"Diastolic",30,160);if(v2>=v1)throw Error("Systolic must be higher than diastolic.")}else{const[l,lo,hi]=VALID[k];v1=num(t,l,lo,hi)}D().vitals.push({ts:new Date().toISOString(),k,v1,v2,note:val("nt")});save();V.vit()});
window.calcBmi=A(()=>{const h=num(val("bh"),"Height",50,250),w=num(val("bw"),"Weight",2,400),b=+(w/(h/100)**2).toFixed(1),ts=new Date().toISOString();D().vitals.push({ts,k:"bmi",v1:b,v2:null,note:""},{ts,k:"weight",v1:w,v2:null,note:"from BMI"});save();$("#bres").innerHTML=`<b>BMI ${b} – ${bmiCat(b)}</b>`;$("#bbar").style.width=Math.min(b/40*100,100)+"%"});
// ---- medicines ----
V.med=()=>{const q=($("#q")?.value||"").toLowerCase();shell("Medicine Manager",`<div class="c"><h3>Add medicine</h3><div class="g">${[["mn","Name"],["md","Dosage (e.g. 500 mg)"],["mf","Frequency"],["ms","Start date","date",new Date().toISOString().slice(0,10)],["me","End date (optional)","date"],["mi","Instructions"],["mr","Reason"],["mdoc","Doctor"],["mt","Dose times (HH:MM, comma-separated)"]].map(f=>inp(...f)).join("")}</div><button onclick="addMed()">Add</button></div><div class="c"><label>Search<input id="q" value="${esc(q)}" oninput="V.med();$('#q').focus()"></label>${rows(["Name","Dosage","Frequency","Start","End","Status",""],D().meds.map((m,i)=>[m,i]).filter(([m])=>m.name.toLowerCase().includes(q)).map(([m,i])=>[m.name,m.dose,m.freq,m.start,m.end||"ongoing",!m.end||m.end>=new Date().toISOString().slice(0,10)?"Active":"Completed"]))}${D().meds.map((m,i)=>`<button class="s" onclick="editMed(${i})">✏️ ${esc(m.name)}</button><button class="s" onclick="delMed(${i})">Delete ${esc(m.name)}</button>`).join("")}<p class="dis">Interaction data is a limited educational dataset – not a complete reference.</p></div>`)};
window.addMed=A(()=>{const n=val("mn"),d=val("md");if(!n)throw Error("Medicine name is required.");if(!/\d/.test(d))throw Error("Dosage must include an amount, e.g. 500 mg.");const s=val("ms"),e=val("me");if(!s)throw Error("Start date is required.");if(val("mt")&&!val("mt").split(",").every(x=>/^\d\d:\d\d$/.test(x.trim())))throw Error("Dose times must look like 08:00, 20:00.");if(e&&e<s)throw Error("End date is before start date.");const act=active().map(m=>m.name.toLowerCase()),w=INT.filter(([a,b])=>(a==n.toLowerCase()&&act.includes(b))||(b==n.toLowerCase()&&act.includes(a)));D().meds.push({name:n,dose:d,freq:val("mf"),start:s,end:e,times:val("mt"),instr:val("mi"),reason:val("mr"),doc:val("mdoc")});save();if(w.length)alert("⚠️ Potential interaction detected\n\n"+w.map(x=>`${x[0]} + ${x[1]} – ${x[2]}: ${x[3]}`).join("\n")+"\n\nConsult a doctor/pharmacist before combining medicines. Do not change or stop prescribed medicine on your own.");V.med()});
window.delMed=i=>{if(confirm("Delete this medicine?")){D().meds.splice(i,1);save();V.med()}};
// ---- trends ----
const insights=()=>{const n=[],nm={weight:"Weight",bmi:"BMI",hr:"Heart rate",temp:"Temperature",bp:"Blood pressure (systolic)"};for(const k in nm){const y=D().vitals.filter(v=>v.k==k).slice(-4).map(v=>v.v1);if(y.length<2)continue;const ch=(y.at(-1)-y[0])/y[0]*100;n.push(y.length>=3&&y.every((v,i)=>!i||v>y[i-1])?`${nm[k]}: recorded values increased over the last ${y.length} entries (${ch.toFixed(1)}%) – ${Math.abs(ch)>10?"Requires professional review":"Possible concerning trend"}.`:`${nm[k]}: normal variation (${ch.toFixed(1)}% over last ${y.length} entries).`)}const c={},m=new Date().toISOString().slice(0,7);D().sym.filter(s=>s.ts.startsWith(m)).forEach(s=>s.s.forEach(x=>c[x]=(c[x]||0)+1));for(const x in c)if(c[x]>1)n.push(`${x} episodes were recorded ${c[x]} times this month.`);return n};
function chart(t,y){const W=300,H=110,mx=Math.max(...y),mn=Math.min(...y),r=mx-mn||1,p=y.map((v,i)=>`${10+i*(W-20)/(y.length-1)},${H-15-(v-mn)/r*(H-35)}`).join(" ");return`<div class="c"><h3>${t}</h3><svg viewBox="0 0 ${W} ${H}"><polyline points="${p}" fill="none" stroke="#1a9aa6" stroke-width="2"/><text x="10" y="12" font-size="10">${mx}</text><text x="10" y="${H-2}" font-size="10">${mn}</text></svg></div>`}
V.tr=()=>{const nm={weight:"Weight",bmi:"BMI",hr:"Heart rate",temp:"Temperature",bp:"Blood pressure (systolic)"};const ch=Object.entries(nm).map(([k,l])=>[l,D().vitals.filter(v=>v.k==k).map(v=>v.v1)]).filter(x=>x[1].length>1);shell("Health Pattern Analyzer",`<div class="g">${ch.map(x=>chart(...x)).join("")||"<p>Record at least 2 readings of a vital to see charts.</p>"}</div><div class="c"><h3>Insights</h3>${insights().map(x=>`<p>• ${esc(x)}</p>`).join("")||"No insights yet."}<p class="dis">Trends are informational only and never a diagnosis.</p></div>`)};
// ---- history ----
V.his=()=>{const f=$("#f")?.value||"All",ev=[...D().sym.map(s=>[s.ts,"Symptom",`${s.s.join(", ")} (severity ${s.sev}, risk ${s.risk})`]),...D().vitals.map(v=>[v.ts,"Vital",`${KINDS[v.k]||"BMI"}: ${fmt(v)} ${v.note}`]),...D().meds.map(m=>[m.start,"Medicine",`${m.name} ${m.dose} ${m.freq}`])].filter(e=>f=="All"||e[1]==f).sort().reverse();shell("Health History",`<label>Filter<select id="f" onchange="V.his()">${["All","Symptom","Vital","Medicine"].map(o=>`<option ${o==f?"selected":""}>${o}</option>`).join("")}</select></label><div class="c">${rows(["Date","Type","Details"],ev.map(e=>[e[0].slice(0,16).replace("T"," "),e[1],e[2]]))}</div>`)};
// ---- knowledge / emergency ----
V.kb=()=>{shell("Medical Knowledge Base (local)",`<label>Search<input id="q" oninput="kbs()" placeholder="headache, fever, cough, dehydration…"></label><div id="kr"></div>`);kbs()};
window.kbs=()=>{const q=($("#q")?.value||"").toLowerCase();$("#kr").innerHTML=KB.filter(r=>r.join(" ").toLowerCase().includes(q)).map(r=>`<div class="c"><h3>${r[0]}</h3><p><b>Symptoms:</b> ${r[1]}<br>${r[2]}<br><b>Risk factors:</b> ${r[3]}<br><b>Warning signs:</b> ${r[4]}<br><b>Seek help:</b> ${r[5]}</p></div>`).join("")||"No local results."};
V.em=()=>shell("Emergency Guide",`<div class="red">If you believe this is an emergency, contact your local emergency medical service or go to the nearest emergency department.</div>${Object.entries(GUIDE).map(([k,t])=>`<div class="c"><h3>${k}</h3>${t}</div>`).join("")}`);
// ---- report / profile ----
V.rep=()=>{const p=U().p,b=D().vitals.filter(v=>v.k=="bmi");shell("Doctor Report",`<button onclick="print()">Print / Save as PDF</button><div class="c"><h3>Patient</h3><p>${esc(p.name)} • Age ${p.age} • ${esc(p.gender)} • Blood group ${esc(p.bg)}<br>Allergies: ${esc(p.al||"none")}<br>Conditions: ${esc(p.co||"none")}<br>Emergency contact: ${esc(p.ec)}<br>Generated: ${new Date().toLocaleString()}</p></div><div class="c"><h3>Current medicines</h3>${rows(["Medicine","Dosage","Frequency"],active().map(m=>[m.name,m.dose,m.freq]))}</div><div class="c"><h3>Recent symptoms</h3>${rows(["Date","Symptoms","Risk"],D().sym.slice(-8).reverse().map(s=>[s.ts.slice(0,10),s.s.join(", "),s.risk]))}</div><div class="c"><h3>Recent vitals</h3>${rows(["Date","Vital","Value","Status"],D().vitals.slice(-10).reverse().map(v=>[v.ts.slice(0,10),KINDS[v.k]||"BMI",fmt(v),stat(v)]))}</div><div class="c"><h3>BMI history</h3>${b.map(x=>x.v1).join(" → ")||"None"}</div><div class="c"><h3>Trends</h3>${insights().map(x=>`<p>• ${esc(x)}</p>`).join("")||"None"}</div>`)};
V.pro=()=>{const p=U().p;shell("Profile & Privacy",`<div class="c">${Object.entries({Name:p.name,Age:p.age,Gender:p.gender,"Height (cm)":p.height,"Weight (kg)":p.weight,"Blood group":p.bg,"Emergency contact":p.ec,Allergies:p.al,Conditions:p.co}).map(([k,v])=>`<p><b>${k}:</b> ${esc(v)}</p>`).join("")}</div><div class="c"><h3>🔒 Privacy</h3><p>Your health records are stored locally in this browser (localStorage). Nothing is uploaded; passwords are stored only as salted PBKDF2 hashes. Clearing browser data erases your records.</p><button class="s" onclick="if(confirm('Permanently delete this account and all its data?')){delete DB.users[me];save();me=null;V.login()}">Delete my account & data</button></div>`)};

// ===== upgrades =====
const _sh=shell;shell=(t,b)=>{_sh(t,b);$("nav").insertAdjacentHTML("beforeend",'<a onclick="document.body.classList.toggle(\'dk\')">🌙 Dark mode</a>')};
const adh=()=>{const a=D().adh||[],t=a.filter(x=>x.st=="taken").length;return a.length?Math.round(t/a.length*100):null};
function ring(p,l,c="#1a9aa6",txt){const r=36,C=2*Math.PI*r;return`<div class="ring"><svg viewBox="0 0 90 90"><circle cx="45" cy="45" r="${r}" fill="none" stroke="var(--tr)" stroke-width="9"/><circle cx="45" cy="45" r="${r}" fill="none" stroke="${c}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C*(p||0)/100} ${C}" transform="rotate(-90 45 45)"/><text x="45" y="50" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor">${txt??(p==null?"—":p+"%")}</text></svg>${l}</div>`}
const times=m=>(m.times||"").split(",").map(x=>x.trim()).filter(x=>/^\d\d:\d\d$/.test(x));
const nextDose=()=>{const hm=new Date().toTimeString().slice(0,5);let b=null;active().forEach(m=>times(m).forEach(t=>{if(t>=hm&&(!b||t<b.t))b={t,m}}));return b};
const chip=s=>s?`<span class="chip ${s[0]=="W"?"ok":""}">${s}</span>`:"";
const VK=["bp","hr","temp","spo2","glucose"];
function score(){let s=100;VK.forEach(k=>{const v=last(k);if(v&&stat(v)!="Within range")s-=12});const l=D().sym.slice(-1)[0];if(l&&["High","Emergency"].includes(l.risk))s-=20;return Math.max(s,0)}
V.dash=()=>{const u=U(),b=last("bmi"),nd=nextDose(),al=[];VK.forEach(k=>{const v=last(k);if(v&&stat(v)!="Within range")al.push(`${KINDS[k]} ${fmt(v)} is ${stat(v).toLowerCase()} (reference range)`)});const l=D().sym.slice(-1)[0];if(l&&["High","Emergency"].includes(l.risk))al.push(`Last symptom check: ${l.risk} risk`);
shell("Dashboard",`<div class="hero"><h2 style="margin:0">Hello, ${esc(u.p.name)} 👋</h2><div>${new Date().toDateString()} • ${nd?`Next dose: <b>${esc(nd.m.name)}</b> at ${nd.t}`:"No upcoming doses today"}</div></div>
<div class="g"><div class="c" style="display:flex;justify-content:space-around">${ring(score(),"Health score",score()<70?"#e08a00":"#1a9aa6")}${ring(b?Math.min(b.v1/40*100,100):0,"BMI "+(b?bmiCat(b.v1):""),b&&(b.v1>=25||b.v1<18.5)?"#e08a00":"#1a9aa6",b?b.v1:"—")}${ring(adh(),"Adherence")}</div><div class="c"><h3>⚠️ Risk alerts</h3>${al.map(x=>`<p>• ${esc(x)}</p>`).join("")||"No alerts from recorded data."}</div></div>
<div class="tiles">${NAV.slice(1,9).map(([k,l])=>`<div class="tile" onclick="go('${k}')">${l}</div>`).join("")}</div>
<div class="g"><div class="c"><h3>Recent vitals</h3>${rows(["Vital","Value","Status"],D().vitals.filter(v=>v.k!="bmi").slice(-4).reverse().map(v=>[KINDS[v.k],fmt(v),stat(v)]))}</div><div class="c"><h3>Recent symptoms</h3>${rows(["Date","Symptoms","Risk"],D().sym.slice(-4).reverse().map(x=>[x.ts.slice(0,10),x.s.join(", "),x.risk]))}</div><div class="c"><h3>Current medicines</h3>${rows(["Medicine","Dosage","Times"],active().map(m=>[m.name,m.dose,m.times||"—"]))}</div></div>
<p><button class="s" onclick="loadDemo()">Load SAMPLE data</button><button class="s" onclick="clearDemo()">Remove sample data</button> <small>Sample data is clearly labeled and optional.</small></p>`)};
// reminders
let snooze={};
function remind(m,t,key){document.body.insertAdjacentHTML("beforeend",`<div id="rm"><div><h2>💊 Medicine Reminder</h2><p><b>Medicine:</b> ${esc(m.name)}<br><b>Dosage:</b> ${esc(m.dose)}<br><b>Time:</b> ${t}</p><button onclick="rem('taken','${key}','${esc(m.name)}')">Taken</button><button class="s" onclick="rem('skipped','${key}','${esc(m.name)}')">Skip</button><button class="s" onclick="rem('snooze','${key}','')">Snooze 10 min</button></div></div>`)}
window.rem=(st,key,name)=>{if(st=="snooze")snooze[key]=Date.now()+6e5;else{(D().adh=D().adh||[]).push({key,med:name,st,ts:new Date().toISOString()});save()}$("#rm")?.remove();if(cur=="med"||cur=="dash")go(cur)};
function tick(){if(!me||$("#rm"))return;const n=new Date(),hm=n.toTimeString().slice(0,5),day=n.toISOString().slice(0,10),mins=n.getHours()*60+n.getMinutes();D().adh=D().adh||[];for(const m of active())for(const t of times(m)){const key=m.name+t+day,[h,mi]=t.split(":"),d=mins-(+h*60+ +mi);if(d>=0&&d<=180&&!D().adh.some(a=>a.key==key)&&!(snooze[key]>Date.now())){remind(m,t,key);return}}}
setInterval(tick,15000);
const _med=V.med;V.med=()=>{_med();const a=adh();$("main h1").insertAdjacentHTML("afterend",`<div class="c"><h3>Adherence</h3>${a==null?"No dose responses logged yet.":`<b>${a}%</b> (taken ÷ logged doses × 100)<div class="bar"><i style="width:${a}%"></i></div>`}<p class="dis">Reminders appear while this page is open. Set dose times as 08:00, 20:00.</p><button class="s" onclick="const m=active()[0];m?remind(m,'preview','prev'+Date.now()):alert('Add a medicine first.')">Preview reminder</button></div>`)};
window.editMed=A(i=>{const m=D().meds[i],g=(l,v)=>{const r=prompt(l,v||"");return r===null?v:r.trim()};const dose=g("Dosage",m.dose);if(!/\d/.test(dose))throw Error("Dosage must include an amount.");const tm=g("Dose times (HH:MM, comma-separated)",m.times),end=g("End date (YYYY-MM-DD, blank = ongoing)",m.end);if(tm&&!tm.split(",").every(x=>/^\d\d:\d\d$/.test(x.trim())))throw Error("Dose times must look like 08:00, 20:00.");Object.assign(m,{dose,freq:g("Frequency",m.freq),times:tm,end});save();V.med()});
// sample data
window.loadDemo=()=>{const d=D(),n=Date.now(),day=864e5,ts=k=>new Date(n-k*day).toISOString(),v=(k,a,b,c,d2)=>d.vitals.push({ts:ts(a),k,v1:b,v2:c||null,note:"SAMPLE DATA",demo:1});
[[6,70,70.0],[4,70.8],[2,71.5],[0,72.4]].forEach(x=>{v("weight",x[0],x[1]);});[[6,118,78],[4,122,80],[2,128,83],[0,134,87]].forEach(x=>v("bp",x[0],x[1],x[2]));[[6,72],[3,78],[0,84]].forEach(x=>v("hr",x[0],x[1]));[[6,24.2],[0,25.0]].forEach(x=>v("bmi",x[0],x[1]));
[[5,["Headache","Fatigue"],2],[3,["Headache","Nausea"],3],[1,["Headache","Cough","Sore throat"],2]].forEach(x=>d.sym.push({ts:ts(x[0]),s:x[1],sev:x[2],dur:2,t:0,risk:x[2]>=3?"Moderate":"Low",top:"SAMPLE",demo:1}));
d.meds.push({name:"Lisinopril (SAMPLE)",dose:"10 mg",freq:"Daily",start:ts(10).slice(0,10),end:"",times:"08:00",demo:1});d.adh=(d.adh||[]).concat([["taken",3],["taken",2],["skipped",1],["taken",0]].map(x=>({key:"demo"+x[1],med:"SAMPLE",st:x[0],ts:ts(x[1]),demo:1})));save();go(cur)};
window.clearDemo=()=>{const d=D();d.vitals=d.vitals.filter(x=>!x.demo);d.sym=d.sym.filter(x=>!x.demo);d.meds=d.meds.filter(x=>!x.demo);d.adh=(d.adh||[]).filter(x=>!x.demo);save();go(cur)};

// ===== chart visuals =====
const RC={Low:"#2e9e5b",Moderate:"#e6c229",High:"#e08a00",Emergency:"#c62828"};
function donut(data){const t=data.reduce((a,x)=>a+x[1],0);if(!t)return"<p>No assessments yet.</p>";let a=0;const r=40,C=2*Math.PI*r;return`<svg viewBox="0 0 120 120" width="150">${data.map(([k,n])=>{const l=n/t*C,c=`<circle cx="60" cy="60" r="${r}" fill="none" stroke="${RC[k]}" stroke-width="18" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-a}" transform="rotate(-90 60 60)"/>`;a+=l;return c}).join("")}<text x="60" y="66" text-anchor="middle" font-size="20" font-weight="700" fill="currentColor">${t}</text></svg><div>${data.map(([k,n])=>`<span class="chip" style="background:${RC[k]}33">${k}: ${n}</span> `).join("")}</div>`}
function lines(ser){const all=ser.flatMap(s=>s.y);if(!all.length||ser.every(s=>s.y.length<2))return"<p>Record 2+ readings to see this chart.</p>";const W=420,H=170,mx=Math.max(...all)+5,mn=Math.min(...all)-5,X=(i,n)=>30+i*(W-45)/(n-1),Y=v=>H-22-(v-mn)/(mx-mn)*(H-40);let g="";for(let i=0;i<=4;i++){const v=mn+(mx-mn)*i/4,y=Y(v);g+=`<line x1="30" x2="${W-10}" y1="${y}" y2="${y}" stroke="var(--tr)"/><text x="2" y="${y+3}" font-size="9" fill="currentColor">${v.toFixed(0)}</text>`}
const S=ser.filter(s=>s.y.length>1);return`<svg viewBox="0 0 ${W} ${H}" width="100%">${g}${S.map(s=>{const pts=s.y.map((v,i)=>X(i,s.y.length)+","+Y(v));return`<polygon points="${X(0,s.y.length)},${H-22} ${pts.join(" ")} ${X(s.y.length-1,s.y.length)},${H-22}" fill="${s.c}" opacity=".08"/><polyline fill="none" stroke="${s.c}" stroke-width="2.5" points="${pts.join(" ")}"/>${s.y.map((v,i)=>`<circle cx="${X(i,s.y.length)}" cy="${Y(v)}" r="3.5" fill="${s.c}"/>`).join("")}`}).join("")}</svg><div>${S.map(s=>`<span class="chip" style="background:${s.c}33">● ${s.n}</span> `).join("")}</div>`}
function bars(e){if(!e.length)return"<p>No symptoms recorded.</p>";const m=Math.max(...e.map(x=>x[1]));return e.map(([k,n])=>`<div style="font-size:12px;margin:6px 0">${esc(k)} (${n})<div class="bar"><i style="width:${n/m*100}%"></i></div></div>`).join("")}
function gauge(b){const p=b?Math.min(Math.max((b.v1-15)/25*100,0),100):0;return`<div style="position:relative;margin:26px 0 6px"><div style="display:flex;height:16px;border-radius:8px;overflow:hidden"><i style="flex:14;background:#4a90d9"></i><i style="flex:26;background:#2e9e5b"></i><i style="flex:20;background:#e08a00"></i><i style="flex:40;background:#c62828"></i></div>${b?`<span style="position:absolute;left:${p}%;top:-20px;transform:translateX(-50%)">▼</span>`:""}</div><small>${b?`BMI ${b.v1} – ${bmiCat(b.v1)}`:"No BMI record yet"} (scale 15–40)</small>`}
chart=(t,y)=>`<div class="c sp" style="grid-column:span 2"><h3>${t}</h3>${lines([{n:t,c:"#1a9aa6",y}])}</div>`;
const _d=V.dash;V.dash=()=>{_d();const y=k=>D().vitals.filter(v=>v.k==k).slice(-10),sy={},rk={};D().sym.forEach(s=>{rk[s.risk]=(rk[s.risk]||0)+1;s.s.forEach(x=>sy[x]=(sy[x]||0)+1)});
$(".tiles").insertAdjacentHTML("afterend",`<div class="g"><div class="c sp" style="grid-column:span 2"><h3>📈 Vitals trend</h3>${lines([{n:"Systolic",c:"#c62828",y:y("bp").map(v=>v.v1)},{n:"Diastolic",c:"#e08a00",y:y("bp").map(v=>v.v2)},{n:"Heart rate",c:"#1a9aa6",y:y("hr").map(v=>v.v1)}])}</div><div class="c"><h3>⚖️ BMI</h3>${gauge(last("bmi"))}</div><div class="c"><h3>🩺 Risk levels</h3>${donut(Object.entries(rk))}</div><div class="c"><h3>🔁 Top symptoms</h3>${bars(Object.entries(sy).sort((a,b)=>b[1]-a[1]).slice(0,5))}</div></div>`)};
V.login();
</script></body></html>
